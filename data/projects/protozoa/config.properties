# Configuration for the protozoa database.

# The genus-level `unclassified' buckets are left out in taxids.txt. Without this line that only
# keeps their genomes out of the database, while the update still reads every region of the RefSeq
# release and lets them raise the k-mers of the species that stay -- which is the whole effect worth
# avoiding. `allButExcluded' is `all' minus the regions of exactly those taxa.
#
# The price, and it is real: a k-mer that besides a kept species only an excluded genome carries now
# stays claimed for that species. Where the excluded genome was in truth a different organism, the
# claim is wrong. This is a considered trade for branches whose members cannot be told apart from the
# kept ones anyway, not a way to make a database look more specific than it is.
refseq.updateScope=allButExcluded
