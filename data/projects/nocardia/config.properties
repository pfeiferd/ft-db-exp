# Nocardia (taxid 1817) -- see taxids.txt for what this project is and why.# THE K-MER INDEX FALSE POSITIVE RATE.
#
# KMerStoreWorkGoal builds a carrier vector with one independent Bloom probe per direct child plus
# OTHER, and getBestMatchingNode needs coversAll -- so a single phantom bit pushes a k-mer up the
# tree and a phantom OTHER bit pins it at the parent. The vector is clean with probability
# (1-fpp)^(C+1), and the rule is to pick fpp as -ln(P)/(C+1) for the largest child count C of any
# refined node.
#
# Here C = 125: the direct children of 1817 that carry genomes (of 158 children in all), counted
# from data/common/refseq/assembly_summary_refseq.txt against the taxdump beside it.
#
#   fpp 1e-2 (the shipped default, blocked filter, really 1.3e-2)  ->  P(clean) = 0.20
#   fpp 1e-4                                                       ->  P(clean) = 0.987
#   fpp 1e-5                                                       ->  P(clean) = 0.9987
#
# 1e-5 is chosen with room to spare, because the cost of being wrong here is a whole rebuild that
# measures the filter's noise floor instead of the biology. Below the default Genestrip switches
# from BlockedBloomFilter to a plain BloomFilter, which at 1e-5 needs about 24 bits per entry and
# roughly 90 ns per probe -- four times the blocked filter's probe time, and worth it.
#
# TRAP: nothing invalidates a stored index. A run that finds db/nocardia_storekmerindex.ser.gz
# loads it and silently keeps the FPP it was written with. Delete that file by hand after changing
# this value, and confirm from the log that it says "K-mer index filter: BloomFilter ...", not
# BlockedBloomFilter.
ftIndexBloomFilterFpp=1e-5

# MEMORY: THE UNCAPPED BUILD IS THE BUILD, AND IT NEEDS THE HEAP.
#
# FillDBGoal OOMs in RadixKMerStore's constructor unless the heap is large enough for two things
# that are live at the same moment and neither of which is optional. FillDBGoal:118 passes the
# filter as a constructor ARGUMENT, so it is fully allocated before RadixKMerStore:294 begins
# allocating the long[] buckets -- the filter cannot be built later or dropped earlier.
#
#   store radixIndex   18.0 GiB   8 bytes per distinct k-mer (RadixKMerStore:294, new long[s])
#   values             ~4.5 GiB
#   fill Bloom filter  14.9 GiB   sized for the same count at fillBloomFilterFpp=1e-11
#   ----------------------------
#   needed             ~37.4 GiB  live, at the 2,420,546,219 distinct k-mers last counted
#
# So run this project with -Xmx48g or more. Do NOT loosen fillBloomFilterFpp to save the 14.9 GiB:
# a false positive is a genuinely new k-mer taken for a duplicate and silently dropped -- 1e-7
# loses about 245 k-mers, 1e-5 about 24,500, 1e-4 about 245,000.
#
# WHY THERE IS NO CAP HERE, THOUGH THERE IS ONE UNDER strepto. A per-species genome cap saves
# nothing in this genus, and the numbers in taxids.txt say why: 1,045 RefSeq assemblies spread over
# 405 species-rank taxa, i.e. 2.6 apiece. maxGenomesPerTaxid=50 at rank species removes exactly
# zero genomes -- it was set here for a while and the distinct count did not move. Nor would a
# tighter cap help: 405 species at ~7.6 Mbp is ~3.1e9 k-mers against 2.42e9 distinct observed, so
# the distinct count already IS about one genome per species and the assembly redundancy is
# deduplicated away before it reaches the store. What drives the size is species diversity, and the
# only lever on that is taxids.txt. Narrowing the genus to the clinically relevant complexes is a
# scientific decision and would be defensible; a memory cap that happens to fire is not, and here
# it does not fire at all.
