# Nocardia (taxid 1817) -- see taxids.txt for what this project is and why.
#
# Everything not set here comes from data/config.properties, which is where this paper's shared
# decisions live (all genomes rather than a curated subset, dataNodes=true, maxDust=500).
#
# No genome cap is set here, unlike in the streptococcus project beside it: 1,045 assemblies and
# 7.9 Gbp are tick-borne scale already (4,135 / 5.8 Gbp), so this one builds in full.

# WHERE THE TREE IS REFINED.
#
# Restricted to the position this case study is about: the genus node itself. `species group' is
# listed too, for symmetry with the streptococcus project and because it costs nothing -- but under
# Nocardia there is not a single species-group node, which is the whole point of the case: all 124
# populated species children of 1817 hang directly under the genus, and the complexes clinical
# microbiology works with (N. asteroides, N. nova, N. transvalensis, N. brasiliensis) have no node
# in the reference taxonomy at all.
#
# This is deliberately *not* the shipped default `*'. With `*' the DATA nodes under the larger
# species would be refined too (N. cyriacigeorgica has 167 assemblies), which is the within-species
# regime that the C. difficile study showed has nothing to work on, and which drives the branching
# degree into the range where `coversAll' cannot survive the index filter's false positives.
#
# `genus,species group,subgenus' was the shipped default of an earlier version of Genestrip-FT, so
# this is a well-trodden setting rather than an exotic one. Widening it to `*' afterwards is a
# legitimate second experiment -- but run it as a second experiment, with its own fpp.
refinementPositions=genus,species group

# THE K-MER INDEX FALSE POSITIVE RATE.
#
# KMerStoreWorkGoal builds a carrier vector with one independent Bloom probe per direct child plus
# OTHER, and getBestMatchingNode needs coversAll -- so a single phantom bit pushes a k-mer up the
# tree and a phantom OTHER bit pins it at the parent. The vector is clean with probability
# (1-fpp)^(C+1), and the rule is to pick fpp as -ln(P)/(C+1) for the largest child count C of any
# refined node.
#
# Here C = 125: the direct children of 1817 that carry genomes (of 158 children in all), counted
# from data/common/refseq/assembly_summary_refseq.txt against the taxdump beside it.
#
#   fpp 1e-2 (the shipped default, blocked filter, really 1.3e-2)  ->  P(clean) = 0.20
#   fpp 1e-4                                                       ->  P(clean) = 0.987
#   fpp 1e-5                                                       ->  P(clean) = 0.9987
#
# 1e-5 is chosen with room to spare, because the cost of being wrong here is a whole rebuild that
# measures the filter's noise floor instead of the biology. Below the default Genestrip switches
# from BlockedBloomFilter to a plain BloomFilter, which at 1e-5 needs about 24 bits per entry and
# roughly 90 ns per probe -- four times the blocked filter's probe time, and worth it.
#
# TRAP: nothing invalidates a stored index. A run that finds db/nocardia_storekmerindex.ser.gz
# loads it and silently keeps the FPP it was written with. Delete that file by hand after changing
# this value, and confirm from the log that it says "K-mer index filter: BloomFilter ...", not
# BlockedBloomFilter.
ftIndexBloomFilterFpp=1e-5

# SIMILARITY MEASURE.
#
# Left at the default `true' on purpose: the children of a genus node are taxa, not individual
# genomes of comparable true size, so the Jaccard index is the right measure and containment would
# score a sparse child as identical to whichever dense one contains it. (Containment is for the
# opposite case -- individual draft assemblies of one species, where a small k-mer set means missing
# sequence rather than different sequence.)
jaccardSim=true

# clusterMethod is left at the default SINGLE_LINKAGE, as for the paper's other databases.

# dataNodes is left at the project-wide `true' of data/config.properties. The svg* rendering keys
# of the borrelia/orthopox projects are deliberately not set here: those exist to draw the figures
# of the Methods section, this is a database project.
