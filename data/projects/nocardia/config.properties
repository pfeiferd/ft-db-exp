# Nocardia (taxid 1817) -- see taxids.txt for what this project is and why.# THE K-MER INDEX FALSE POSITIVE RATE.
#
# KMerStoreWorkGoal builds a carrier vector with one independent Bloom probe per direct child plus
# OTHER, and getBestMatchingNode needs coversAll -- so a single phantom bit pushes a k-mer up the
# tree and a phantom OTHER bit pins it at the parent. The vector is clean with probability
# (1-fpp)^(C+1), and the rule is to pick fpp as -ln(P)/(C+1) for the largest child count C of any
# refined node.
#
# Here C = 125: the direct children of 1817 that carry genomes (of 158 children in all), counted
# from data/common/refseq/assembly_summary_refseq.txt against the taxdump beside it.
#
#   fpp 1e-2 (the shipped default, blocked filter, really 1.3e-2)  ->  P(clean) = 0.20
#   fpp 1e-4                                                       ->  P(clean) = 0.987
#   fpp 1e-5                                                       ->  P(clean) = 0.9987
#
# 1e-5 is chosen with room to spare, because the cost of being wrong here is a whole rebuild that
# measures the filter's noise floor instead of the biology. Below the default Genestrip switches
# from BlockedBloomFilter to a plain BloomFilter, which at 1e-5 needs about 24 bits per entry and
# roughly 90 ns per probe -- four times the blocked filter's probe time, and worth it.
#
# TRAP: nothing invalidates a stored index. A run that finds db/nocardia_storekmerindex.ser.gz
# loads it and silently keeps the FPP it was written with. Delete that file by hand after changing
# this value, and confirm from the log that it says "K-mer index filter: BloomFilter ...", not
# BlockedBloomFilter.
ftIndexBloomFilterFpp=1e-5

# THE PER-SPECIES GENOME CAP -- a screening measure, not the final build.
#
# WHY IT IS HERE. The uncapped build does not fit. FillSizeGoal counted 2,451,530,219 distinct
# k-mers over 3,564 files (8.0e9 with duplicates, duplication 3.27), and FillDBGoal then OOMs in
# RadixKMerStore's constructor. Two things are live at that moment and neither is optional:
#
#   store radixIndex   22.8 GiB   10 bytes per distinct k-mer, FillDBGoal's own estimate
#   fill Bloom filter  15.0 GiB   sized for the same count at fillBloomFilterFpp=1e-11
#   ----------------------------
#   needed             37.9 GiB   against a 20.6 GiB heap (21120 MB)
#
# The filter is the duplicate detector, consulted on every insert (RadixKMerStore:512), and the
# buckets are unsorted during the fill, so there is no cheap exact test to replace it. It lives for
# the whole fill and is discarded only at optimize(). Do NOT loosen fillBloomFilterFpp to save the
# 15 GiB: a false positive is a genuinely new k-mer taken for a duplicate and silently dropped --
# 1e-7 loses about 245 k-mers, 1e-5 about 24,500, 1e-4 about 245,000.
#
# At 16.6 bytes per distinct k-mer for store plus filter, the present heap holds about 1.17e9
# distinct. The cap is the way to get under that; the alternative is a ~44 GB heap.
#
# WHAT IT DOES AND DOES NOT TOUCH -- the same asymmetry as strepto, and it is what makes the cap
# safe here. Only the FILL is capped, so fewer k-mers are stored, which is the whole saving. The LCA
# UPDATE is not: DBGoal.MyFastaReader overrides infoLine() and consults only isContigInScope(), so
# the genomes left out still raise the k-mers of the ones kept and the specificity of the refinement
# is unaffected. The K-MER INDEX is not capped either. Quality is, by the same selection the fill
# used. So this buys RAM and disk, not wall clock: the update and the index still read the sequence.
#
# WHAT IT COSTS. A species is stored from fifty genomes but judged against every genome of every
# neighbour, so what it keeps of its own is a lower bound, and the more it is trimmed the lower.
#
# >>> REMOVE THESE TWO LINES FOR THE FINAL BUILD <<< and delete data/projects/nocardia/db first, or
# the screening database is silently reused -- the stored accession map included, which is where the
# selection lives. Keeping the cap goes against the note at the head of data/config.properties
# ("let's have all genomes ... make paper easier to defend"), and it would leave nocardia capped
# where the paper's other bacterial databases are not. The final build needs the heap, not the cap.
maxGenomesPerTaxid=50
maxPerTaxidRank=species
