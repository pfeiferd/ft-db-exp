#refseq.assemblyAccessionsOnly=true

# No genomic dust filter for this project, overriding `maxDust=500' from ../../config.properties.
#
# SET ON 2026-10-07 on Daniel's instruction, together with disabling the host entry in
# additional.txt, and for one reason: `cv' is the only database of this study that is held against
# KrakenUniq and Kraken 2, and those two cannot be given a comparable filter. Kraken 2's
# `--no-masking' in bin/kraken_build.sh leaves its library unmasked and krakenuniq-build offers no
# masking at all, so the one setting in which all three treat low-complexity sequence alike is that
# none of them filters it. Genestrip's Fibonacci dust function and dustmasker are not the same
# criterion in any case, so matching them is not on offer.
#
# This is a comparability setting, not a recommendation. Measured on the saliva runs before the
# change: the filter drops 102,354 distinct 31-mers from the project's 19,018 viral genomes, 0.027 %
# of the database, and 0.462 % of the reads of SRR5571991 carry one of them -- which is the whole
# 0.28 to 0.42 percentage point difference between `cv' and `cv_ku'. Those 102,354 are the most
# promiscuous k-mers there are, so expect |R~^u_g| of Table 9 to grow and its ungated precision to
# fall towards the 0.185 that cv_ku shows. For a real application the filter belongs on, and every
# other project of this study keeps it.
#
# The twins viral-k24, viral-s4 and viral-k24-s4 inherit this line, because their own
# config.properties is generated from this file by bin/k24_projects.sh and bin/sampling_projects.sh.
# Re-run those two scripts after editing here, or the twins keep the old setting.
maxDust=-1
