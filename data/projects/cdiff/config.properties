# Clostridioides difficile, refined below the species rank.
#
# WHY THIS ORGANISM
#
# The other databases of this project are refined between a genus and its species: the LCA update
# strands k-mers on a genus because several of its species share them, and the refinement inserts
# nodes that tell those species apart. C. difficile poses the same problem one rank lower. Its
# clinically meaningful units -- MLST clades 1-5 and the cryptic clades, PCR ribotypes such as 027,
# 078 and 017 -- all sit below the species, and they differ in things that matter: presence of the
# PaLoc at all, a truncated tcdA (the A-B+ lineage), the binary toxin locus CdtLoc, and a large
# accessory genome on a small core. A read carrying a clade-specific k-mer could in principle be
# placed there, and the unrefined database cannot, because there is no node to place it on.
#
# WHY THE TAXONOMY CANNOT SUPPLY THE CHILDREN (checked against NCBI on 2026-08-08)
#
# The subtree of tax id 1496 holds 296 nodes: the species itself and 295 of rank `strain'. Against
# that stand 32,835 GenBank assemblies for the species and its descendants. So the overwhelming
# majority of assemblies carry the *species* tax id and no strain node of their own -- NCBI stopped
# minting strain tax ids about a decade ago. Requesting 1496 and letting the tax tree supply the
# children would therefore refine over a few hundred historical named strains while the bulk of the
# data piles up on the species node itself, contributing k-mers to it and nothing to any child.
#
# `fileNodes' is the way out: it puts an artificial node of rank FILE under the tax id a genome's
# k-mers map to, one per fasta file, so the species node gets one child per assembly regardless of
# what the taxonomy says. That is what the refinement then clusters. The result is a strain-level
# dendrogram built from sequence alone, which is the honest thing to do when the taxonomy has no
# sub-species structure to refine.
#
# Note the cost of that choice: the leaves are assemblies, not taxa, so a cluster is a group of
# genomes and not a named lineage. Whether those clusters recover the known clade structure is the
# question this database exists to ask, not something it assumes.
#
# TO GET THE OTHER VARIANT -- refinement over the 295 strain tax ids, with the assemblies parked at
# the species node left where they are -- set `fileNodes=false'. Nothing else has to change. The
# two are worth building side by side; they are not the same experiment.

# --- What the species node's children are ----------------------------------------------------
# One artificial node per fasta file. With the assembly selection below that is a few hundred
# nodes, comfortably below the 32767 tax ids a database may hold; widening `genbank.fastaQualities'
# without watching that limit is how a build fails late.
fileNodes=true

# NOTE ON dataNodes. It is NOT set here because it is already on: `data/config.properties' sets
# `dataNodes=true' for every project, and Genestrip merges the base, projects and project files.
# Setting it again locally would change nothing.
#
# It matters for where the refinement has to happen, because the two kinds of artificial node
# nest. ReworkingStoreFastaReader.reworkNode() descends the tax id first into its DATA child and
# only then into the FILE node, so the tree below the species is
#
#     1496  ->  "Data for 1496" (rank DATA)  ->  one node of rank FILE per assembly
#
# and the node carrying the ~300 children is the DATA node, not 1496. The strain tax ids that do
# receive genomes hang off 1496 directly, each with a DATA child of its own.
#
# Hence the position below. Naming `1496' would refine the wrong node: its children are the single
# DATA node plus whichever strain tax ids got genomes, so it would cluster those and never see an
# assembly. Turning `dataNodes' off for this project would put the FILE nodes directly under 1496
# and make `1496' the right position -- but the intrinsic quality measures are computed per data
# taxon, so this database's dbquality output would stop being comparable with the others'. Leaving
# the global setting alone and aiming the refinement one level lower is the cheaper of the two.

# --- What gets refined -------------------------------------------------------------------------
# `*' refines wherever the measures allow it, which includes the DATA node above -- correct, and
# what this file shipped with. `DATA' is the same thing stated on purpose: it matches every node of
# that rank, and only the one under 1496 has enough children to cluster (9606 and any single-genome
# strain have one FILE node apiece). Use `DATA' if the run should not spend time refining elsewhere.
refinementPositions=*

# --- Where the genomes come from --------------------------------------------------------------
# GenBank is not optional for this database. The RefSeq holds a fraction of the sequenced strain
# diversity, and it is precisely the diversity that the refinement has to see. The limit is set
# high enough to always consult GenBank, as the `vineyard' project does.
refSeq.limitForGenbankAccess=10000000
# Complete and chromosome-level current assemblies. Checked against NCBI on 2026-08-08: of the
# 32,835 assemblies for this species and its descendants, 306 are complete genomes and *none* is
# chromosome-level, so the two qualities together select 300 latest ones and CHROMOSOME_LATEST
# costs nothing here. It is kept because it makes the intent explicit and because a later RefSeq
# release may well have some.
#
# That restriction is a deliberate trade: complete genomes span the clades while keeping the build
# to a size the paper's other databases are comparable with, and a draft assembly's contig breaks
# would show up in a k-mer intersection as sequence that is absent rather than as sequence that
# differs, which is exactly the artefact a dendrogram over k-mer similarity must not be fed.
#
# Do not go to CONTIG_LATEST without capping the result with `maxGenomesPerTaxid': it pulls five
# figures of assemblies, and with `fileNodes' each one spends a tax id out of the 32767 available.
genbank.fastaQualities=COMPLETE_LATEST,CHROMOSOME_LATEST
# No per-tax-id cap: with one species requested, a cap here would cap the whole database.
genbank.maxPerTaxid=-1

# --- Rendering, as for `borrelia' --------------------------------------------------------------
svgShowRank=true
svgDistanceIndent=true
svgShowDistance=true
svgShowDistancePortion=true
svgMarkLongestPath=true
svgKmerNodeIndentFactor=5000
svgDistanceIndentBelowRank=domain
