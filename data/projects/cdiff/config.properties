# Clostridioides difficile, refined below the species rank.
#
# WHY THIS ORGANISM
#
# The other databases of this project are refined between a genus and its species: the LCA update
# strands k-mers on a genus because several of its species share them, and the refinement inserts
# nodes that tell those species apart. C. difficile poses the same problem one rank lower. Its
# clinically meaningful units -- MLST clades 1-5 and the cryptic clades, PCR ribotypes such as 027,
# 078 and 017 -- all sit below the species, and they differ in things that matter: presence of the
# PaLoc at all, a truncated tcdA (the A-B+ lineage), the binary toxin locus CdtLoc, and a large
# accessory genome on a small core. A read carrying a clade-specific k-mer could in principle be
# placed there, and the unrefined database cannot, because there is no node to place it on.
#
# WHY THE TAXONOMY CANNOT SUPPLY THE CHILDREN (checked against NCBI on 2026-08-08)
#
# The subtree of tax id 1496 holds 296 nodes: the species itself and 295 of rank `strain'. Against
# that stand 32,835 GenBank assemblies for the species and its descendants. So the overwhelming
# majority of assemblies carry the *species* tax id and no strain node of their own -- NCBI stopped
# minting strain tax ids about a decade ago. Requesting 1496 and letting the tax tree supply the
# children would therefore refine over a few hundred historical named strains while the bulk of the
# data piles up on the species node itself, contributing k-mers to it and nothing to any child.
#
# `fileNodes' is the way out: it puts an artificial node of rank FILE under the tax id a genome's
# k-mers map to, one per fasta file, so the species node gets one child per assembly regardless of
# what the taxonomy says. That is what the refinement then clusters. The result is a strain-level
# dendrogram built from sequence alone, which is the honest thing to do when the taxonomy has no
# sub-species structure to refine.
#
# Note the cost of that choice: the leaves are assemblies, not taxa, so a cluster is a group of
# genomes and not a named lineage. Whether those clusters recover the known clade structure is the
# question this database exists to ask, not something it assumes.
#
# TO GET THE OTHER VARIANT -- refinement over the 295 strain tax ids, with the assemblies parked at
# the species node left where they are -- set `fileNodes=false'. One more change goes with it now:
# `updateScope' back at its default `all'. Without file nodes there is nothing below the data node
# for `otherTaxaOnly' to protect, so it would only be withholding evidence from the update. The two
# are worth building side by side; they are not the same experiment.

# --- What the species node's children are ----------------------------------------------------
# One artificial node per fasta file. With the genome source below -- Genbank, which delivers one
# fasta per assembly, and the RefSeq release switched off -- that is one node per assembly, some
# 3,500 of them. Well below the value capacity of the k-mer store, which is 2^18 =
# 262144 at the default `radixStoreBits=17' and more as the radix widens; the number that binds
# first is not that one but the pair count of `intersectcount', which is quadratic in it.
fileNodes=true

# NOTE ON dataNodes. It is NOT set here because it is already on: `data/config.properties' sets
# `dataNodes=true' for every project, and Genestrip merges the base, projects and project files.
# Setting it again locally would change nothing.
#
# It matters for where the refinement has to happen, because the two kinds of artificial node
# nest. ReworkingStoreFastaReader.reworkNode() descends the tax id first into its DATA child and
# only then into the FILE node, so the tree below the species is
#
#     1496  ->  "Data for 1496" (rank DATA)  ->  one node of rank FILE per assembly
#
# and the node carrying the ~300 children is the DATA node, not 1496. The strain tax ids that do
# receive genomes hang off 1496 directly, each with a DATA child of its own.
#
# Hence the position below. Naming `1496' would refine the wrong node: its children are the single
# DATA node plus whichever strain tax ids got genomes, so it would cluster those and never see an
# assembly. Turning `dataNodes' off for this project would put the FILE nodes directly under 1496
# and make `1496' the right position -- but the intrinsic quality measures are computed per data
# taxon, so this database's dbquality output would stop being comparable with the others'. Leaving
# the global setting alone and aiming the refinement one level lower is the cheaper of the two.

# --- What gets refined -------------------------------------------------------------------------
# `*' refines wherever the measures allow it, which includes the DATA node above -- correct, and
# what this file shipped with. `DATA' is the same thing stated on purpose: it matches every node of
# that rank, and only the one under 1496 has enough children to cluster (9606 and any single-genome
# strain have one FILE node apiece). Use `DATA' if the run should not spend time refining elsewhere.
refinementPositions=*

# --- Where the genomes come from --------------------------------------------------------------
# Every genome arrives as its own fasta file, and that is the whole requirement: `fileNodes' makes a
# leaf per file, so one file per genome is what puts one genome under each leaf. Genbank satisfies
# it by construction -- its assembly summary lists one genomic fasta per assembly, and Genestrip
# downloads them one by one (FastaFilesFromGenbankGoal) -- and the RefSeq release does not, which is
# why the release is switched off and Genbank is not.
#
# THE RELEASE. With `refseq.filldb' left at its default, the release's own
# `bacteria.N.1.genomic.fna.gz' chunks are read alongside everything else, and `fileNodes' then
# mints one node per *chunk* and not per genome. The database as first built had 786 leaves below
# the species, of which 465 were such chunks -- holding thousands of draft assemblies between them
# -- and 12.0 of the 15.0 million k-mers sitting at a leaf were specific to a file rather than to a
# genome.
#
# Which genomes share a chunk follows the accession order of the release and has nothing to do with
# lineage, so the refinement was clustering an artefact in both directions: within a chunk it
# asserted a specificity the genomes do not have, and across chunks it pushed a lineage-specific
# k-mer above every chunk carrying part of that lineage -- in a single-linkage tree of 391 levels,
# nearly to the top. The measured effect was that the refinement emptied the species node of all
# 10,072,625 k-mers and still left more than 700 of the 786 leaves in question for almost all of
# them.
refseq.filldb=false
# Disregarded while `refseq.filldb=false' -- Genestrip only consults this limit when the RefSeq is
# the basis of the fill, so Genbank is consulted here whatever it says. Kept because it is the
# setting that applies again the moment the RefSeq is switched back on, and because it says what
# the intent is: always consult Genbank, since the RefSeq holds a fraction of the sequenced strain
# diversity and it is precisely that diversity the refinement has to see.
refSeq.limitForGenbankAccess=10000000
# GENBANK, all four current assembly levels. This is a change of mind, and worth recording as one:
# the file used to select COMPLETE_LATEST and CHROMOSOME_LATEST alone -- some 300 finished genomes
# of 32,835 -- on the argument that finished genomes are cleaner. They are, but 300 genomes leave
# most lineages unrepresented, and a lineage no genome represents cannot be found however clean the
# rest is. Breadth is what a sub-species refinement lives on.
#
# Checked against NCBI on 2026-08-08: of the 32,835 assemblies for this species and its
# descendants, 306 are complete genomes and *none* is chromosome-level; the rest are scaffolds and
# contigs. So these two additional levels are what the breadth consists of.
genbank.fastaQualities=COMPLETE_LATEST,CHROMOSOME_LATEST,SCAFFOLD_LATEST,CONTIG_LATEST
# The cap is not optional at those levels, and the binding cost is not the store's: `intersectcount'
# compares every pair of a refined node's children, so n leaves cost n^2/2 pairs. All 32,835 would
# be 5.4e8; 3,500 is 6.1e6, the order of magnitude of the paper's other databases. (The store would
# take far more -- `radixStoreBits=17' allows 2^18 = 262144 values -- so it is not what binds.)
#
# What the cap drops is chosen by quality, not by chance: FastaFilesFromGenbankGoal sorts the worst
# level to the front and removes from there, so the 306 finished genomes survive any cap above 306
# and the remainder is filled up with the best drafts. It applies per tax id, and since nearly every
# assembly of this species carries 1496 itself, it is effectively a cap on the leaves under 1496.
#
# 2,000 instead of 3,500 costs 2.0e6 pairs and is the cheaper build if `intersectcount' turns out to
# dominate the run.
genbank.maxPerTaxid=3500

# --- What the update phase is allowed to see ---------------------------------------------------
# The update raises every stored k-mer to the lowest common ancestor of its current node and the
# nodes of all regions carrying it, reading the whole RefSeq release to do so -- and it reads the
# release whether or not the release was the basis of the fill, because the genomes that would
# raise a k-mer above the requested taxon are precisely those of *other* taxa.
#
# That is what makes this database honest, and, left alone, also what would empty it. The release
# holds this species' genomes too, and there they are not per-assembly files but WGS contigs that
# resolve through the accession map onto tax id 1496 itself. A k-mer of assembly A therefore meets
# its own copy: LCA(FILE(A), DATA(1496)) = DATA(1496). Everything that any release genome carries
# -- 30,249,185 of the 33,254,932 k-mers below the species, 91.0 %, measured on the database as it
# stands -- would land on the data node with nothing left below it.
#
# The invariant behind that: the update is harmless exactly when it meets every genome under the
# same identity the fill gave it. Reading the release's chunks after filling from those same chunks
# satisfies it (`reworkNode()' finds the very node the region was filled into, and LCA(n, n) = n);
# per-assembly fastas break it, because the release presents the same genome under another identity.
#
# `otherTaxaOnly' skips the regions of the requested tax ids and keeps every other, which is the
# half of the update this database needs and no more. A k-mer shared with another species still
# rises out of C. difficile; a k-mer shared between two of its assemblies settles on the common
# ancestor of just those two, and that quantity is what the refinement exists to measure.
#
# THE SCOPE APPLIES TO THE RELEASE ALONE, which is what the `refseq.' prefix says and what the key
# was renamed for. The Genbank assemblies this database is filled from take part in the update
# whatever it is set to, and they must: they arrive under the same per-assembly identity the fill
# gave them, so `LCA(FILE(A), FILE(A)) = FILE(A)' leaves a genome's own k-mers where they are, while
# a k-mer that several assemblies carry settles on the data node -- the common ancestor of those
# leaves. That is the second sentence of the paragraph above, and until 2026-08-13 the code did not
# deliver it: `otherTaxaOnly' skipped every region of tax id 1496, the Genbank fastas among them, so
# a shared k-mer stayed on whichever assembly happened to be filled first. Nothing then reached the
# data node -- and the data node is the only place `intersectcount' looks, since it compares the
# children of the node a k-mer is stored at and a FILE leaf has none.
#
# THE LIMIT OF THAT ARGUMENT, stated because it does not go away. `otherTaxaOnly' is fully correct
# only if the database holds this species' genomes *completely*: a k-mer of a genome that is in the
# release but not in the database keeps a specificity it has not got -- it sits at one leaf while
# genomes outside the database carry it too. At `genbank.maxPerTaxid=3500' of 32,835 assemblies the
# condition is not met, and it cannot be met at a cost `intersectcount' survives (see there).
#
# So what a leaf asserts is specificity *within the database's reference set*, which is what every
# Genestrip database asserts and is exactly the quantity the refinement measures. The alternative is
# not a better claim but no claim: with `all', 91.0 % of the species' k-mers sit on the data node
# and every lineage question is unanswerable. The size of the sample belongs in the paper next to
# the numbers, and nothing further follows from it.
refseq.updateScope=otherTaxaOnly

# --- Joining the leaves to a typing scheme -----------------------------------------------------
# `bin/mlst_assemblies.sh' assigns a sequence type per assembly, and the join to the dendrogram is
# supposed to be free: `fileNodes' names each node after the fasta file it came from, and `mlst'
# reports one row per fasta file.
#
# Check that it still is. The script types the files under `data/projects/cdiff/fasta', which the
# extraction writes one per *accession*, so it regroups them by accession stem
# (<letters><2-digit version><contig number>) and keys its rows by that stem. A leaf, meanwhile, is
# now named after the Genbank assembly file the fill read, e.g.
# `GCA_000009205.2_ASM920v2_genomic.fna.gz'. Stem and assembly file name are not the same string.
# The straightforward fix is to type the downloaded Genbank fastas themselves -- one file is one
# assembly there, so the grouping is not needed at all and the row key is the leaf name.
#
# THE CONTIG-BREAK CAVEAT, which the assembly levels above bring in. A draft's contig breaks show up
# in a k-mer intersection as sequence that
# is absent rather than as sequence that differs, which is exactly the artefact a dendrogram over
# k-mer similarity must not be fed. It is second order here, and the size is worth having on
# record: a break costs k-1 = 30 bases of k-mer coverage, and the drafts carry 151 contigs on
# average (453,728 contigs across 3,006 assemblies), hence some 4,500 bp of 4.3 Mbp, or 0.1 %.
# Unassembled repeats add one to three per cent. Against accessory-genome differences between
# lineages, which run into double-digit percentages, that is a small systematic bias -- but a bias,
# and it should be stated when this build is.
#
# Note also that `refseq.assemblyAccessionsOnly' is NOT the way to select finished genomes: it
# filters accession prefixes, and NZ_ covers whole-genome shotgun contigs as well -- 99.9 % of this
# species' accessions carry it.

# --- How the leaves are clustered ---------------------------------------------------------------
# UPGMA, and this is a correction rather than a preference. The default `SINGLE_LINKAGE' merges on
# the *most* similar pair of members, which over 3,500 genomes of a strongly clonal species chains:
# the first build of this database came out 2,137 levels deep over 3,500 leaves, where a balanced
# tree is about 12, and each refined node peels off a genome or two instead of splitting the set.
#
# Measured on that build, against the sequence types of results/cdiff_mlst.csv: of the 20.3 million
# k-mers stored above the data taxa -- the ones a refinement can act on at all -- the mean number of
# lineages still in question fell from 190.3 to 188.6 of 196, and the share narrowed to 50 lineages
# or fewer from 0.0 % to 0.2 %. The refinement moved 20.0 million k-mers off the species and data
# nodes and narrowed almost nothing by doing so.
#
# That is a property of the linkage and not of the data: `p_st(a) = c_st(a)/|S_v(a)|' and path
# correctness fixes the numerator wherever the k-mer sits, so the whole of what a refinement can
# achieve is a smaller `|S|', and a chain of 2,137 singleton splits cannot deliver one. UPGMA merges
# on the group average, so a cluster's members count equally and near-identical genomes do not drag
# the whole set along one at a time. COMPLETE_LINKAGE and WPGMA are the other two on offer.
#
# NOTE what this does NOT change: the k-mer index (`kmerindexbloom'/`storekmerindex') is built
# before any clustering and is unaffected, so a rebuild for a different linkage need not read the
# genomes again -- provided <db>_storekmerindex.ser.gz is still in place. Delete the files that
# encode the dendrogram BY HAND (db/<db>_ftdb.zip, csv/<db>_ftdbinfo.csv, csv/<db>_ftsvgtaxtree.svg)
# and then re-make `ftdb'. Do NOT reach for the make targets here: `clean' cleans only the internal
# goal the maker aggregates the request into and does nothing at all, while `cleanall' descends into
# every dependency whose key allows transitive cleaning -- `db' is one of them, so `cleanall' on a
# goal above it deletes the unrefined database and the next make rebuilds it from the genomes.
# Learned the hard way on 2026-08-14: `cleanall dbinfo' removed cdiff_db.zip.
clusterMethod=UPGMA

# --- Rendering, as for `borrelia' --------------------------------------------------------------
svgShowRank=true
svgDistanceIndent=true
svgShowDistance=true
svgShowDistancePortion=true
svgMarkLongestPath=true
svgKmerNodeIndentFactor=5000
svgDistanceIndentBelowRank=domain
