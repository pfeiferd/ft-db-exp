# Gut protozoa are poorly represented in the RefSeq: several of the surveyed genera have only one or
# two assembled genomes there, and five have none at all. Genestrip is therefore allowed to fall
# back to Genbank wherever the RefSeq holds fewer than three genomes for a species, which roughly
# doubles the number of species the database can tell apart (e.g. Cryptosporidium goes from 8 to 17).
refSeq.limitForGenbankAccess=3
refSeq.limitForGenbankRank=species

# Keep more than the single best assembly per taxon: with so few genomes per species, the intra-
# species variation carried by additional assemblies is what the refinement has to work with.
genbank.maxPerTaxid=3
genbank.fastaQualities=COMPLETE_LATEST, CHROMOSOME_LATEST, SCAFFOLD_LATEST
