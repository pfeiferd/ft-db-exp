# THE K-MER INDEX FALSE POSITIVE RATE.
#
# KMerStoreWorkGoal builds a carrier vector with one independent Bloom probe per direct child plus
# OTHER, and getBestMatchingNode needs coversAll -- so a single phantom bit pushes a k-mer up the
# tree and a phantom OTHER bit pins it at the parent. The vector is clean with probability
# (1-fpp)^(C+1), and the rule is to pick fpp as -ln(P)/(C+1) for the largest child count C of any
# refined node.
#
# Here C = 148: the direct children of 1301 that carry genomes (of 169 children in all), counted
# from data/common/refseq/assembly_summary_refseq.txt against the taxdump beside it.
#
#   fpp 1e-2 (the shipped default, blocked filter, really 1.3e-2)  ->  P(clean) = 0.14
#   fpp 1e-4                                                       ->  P(clean) = 0.985
#   fpp 1e-5                                                       ->  P(clean) = 0.9985
#
# 1e-5 is chosen with room to spare, because the cost of being wrong here is a whole rebuild that
# measures the filter's noise floor instead of the biology. Below the default Genestrip switches
# from BlockedBloomFilter to a plain BloomFilter, which at 1e-5 needs about 24 bits per entry and
# roughly 90 ns per probe -- four times the blocked filter's probe time, and worth it.
#
# TRAP: nothing invalidates a stored index. A run that finds db/strepto_storekmerindex.ser.gz
# loads it and silently keeps the FPP it was written with. Delete that file by hand after changing
# this value, and confirm from the log that it says "K-mer index filter: BloomFilter ...", not
# BlockedBloomFilter.
ftIndexBloomFilterFpp=1e-5

# DATABASE SIZE -- read this before the first build.
#
# The genus holds 22,664 RefSeq assemblies and 46.6 Gbp of sequence, against 4,135 and 5.8 Gbp for
# tick-borne, which is the largest bacterial database of this paper. Measured anchors from
# ft-paper/results (db_gen_perf.csv, dbstats.tex): tick-borne stores 520,788,183 k-mers in 3.8 GB
# and took 412 min at 25 GB RSS; parasites stores 1,659,904,646 k-mers in 11.4 GB at 35 GB RSS.
# The store costs a steady ~7.4 bytes per k-mer across all five databases.
#
# Streptococcus is far more redundant than any of them -- 9,263 of the 22,664 assemblies are
# S. pneumoniae alone -- so the distinct k-mer count does not scale with the 8x sequence. The
# estimate is 1.5 to 2.5 billion stored k-mers, i.e. 11 to 19 GB on disk: the same order as
# parasites. Disk is not the problem. What is:
#
#   RAM       parasites peaked at 35 GB RSS against a 64 GB heap. At 1.5x its k-mer count this
#             build sits at or past that heap, and an OOM comes hours in.
#   Wall      tick-borne's 412 min are dominated by the LCA update over the whole RefSeq bacteria
#             division, which this project pays too, plus 8x its fill, plus one further pass over
#             the genomes for the AUTO-sized k-mer index.
#
# The k-mer index itself is not a concern here: at ftIndexBloomFilterFpp=1e-5 it costs about 24
# bits per (k-mer, child) pair, a few GB for a genus-only refinement.
#
# THE PER-SPECIES CONTIG CAP, set below.
#
# CORRECTED 2026-08-26. The cap counts *contigs*, not assemblies. AbstractRefSeqFastaReader
# increments its counter once per fasta entry (endContig(), checked in infoLine()), and nothing in
# the RefSeq release says which assembly an entry belongs to. The table that stood here counted
# assemblies and was wrong. maxGenomesPerTaxid now counts assemblies, by grouping the contigs of a
# WGS project on their accession prefix; the contig-counting parameter was dropped from Genestrip on
# the same day, because a knob that looks like this one and is out by seventy is worse than none.
#
# What 50 contigs are worth, measured against data/common/refseq/RefSeq-release233.catalog.gz and
# assembly_summary_refseq.txt beside it:
#
#   species                contigs in RefSeq   assemblies   contigs/asm   50 contigs are
#   S. pneumoniae                    717,500        9,263          77.5    0.65 genomes
#   S. pseudopneumoniae               18,306           167         109.6    0.46 genomes
#   S. mitis                          15,645           242          64.6    0.77 genomes
#   S. mutans                         21,953           398          55.2    0.91 genomes
#   S. oralis                          8,966           259          34.6    1.44 genomes
#   S. infantis                        2,824            84          33.6    1.49 genomes
#
# Every species here gets about ONE genome, not fifty. The claim that 583 of 612 species are
# untouched does not hold either: counted in contigs, essentially all of them are trimmed. And the
# error is one-sided -- the better sequenced a species is, the more of its RefSeq entries are draft
# contigs, so the cap bites hardest exactly where it was meant to bite least. S. pneumoniae, which
# is what this project is about, is the most trimmed taxon of the genus at 0.01 per cent of its
# contigs, against 0.32 for S. mitis and 0.56 for S. oralis -- the two species it is confused with.
#
# For a size bound that does not depend on how fragmented a species' assemblies are, use
# maxKMersPerTaxid instead. It counts k-mers and treats a species held as 300 contigs like one held
# as a single chromosome.
#
# WHAT THE CAP DOES AND DOES NOT TOUCH -- traced through the code on 2026-08-19, because getting
# this wrong would invalidate the screen:
#
#   fill        capped. AbstractRefSeqFastaReader.infoLine() is the single place the field
#               maxGenomesPerTaxId is read, and FillDBGoal / FillSizeGoal / FillBloomFilterGoal all
#               inherit it. This is the whole saving: fewer k-mers stored, hence the RAM and disk.
#   LCA update  NOT capped. DBGoal.MyFastaReader overrides infoLine() outright -- it consults only
#               isContigInScope() and never super.infoLine() -- and overrides isAllowMoreKmers() to
#               return true. The k-mers of the excluded genomes are therefore still raised to their
#               common ancestors, and the specificity of the refinement is NOT affected by this cap.
#               (The three limits used to be passed to that reader and ignored; they were removed
#               from DBGoal.createFastaReader on 2026-08-19 because they read as if they applied.)
#               NOTE what this asymmetry costs: a species is stored from one genome's worth of
#               contigs but judged against every genome of every neighbour. What it keeps of its own
#               is therefore a lower bound, and the more it is trimmed the lower.
#   k-mer index NOT capped, deliberately: AbstractKMerIndexGoal's reader overrides infoLine(),
#               endContig() and isAllowMoreKmers() with the comment that the clustering phase is to
#               have the maximum amount of data. So the Jaccard matrix and the branching histograms
#               see all 22,664 genomes for whatever k-mers are in the store, capped or not.
#   quality     capped. DBQualityCountsGoal's reader extends AbstractUpdateFastaReader, which does
#               call super.infoLine(), and overrides nothing here -- so it measures against the same
#               genome set the fill used, which is what it should do.
#
#   Consequence for the cost: the cap saves stored k-mers and fill CPU; the update and the k-mer
#   index still read the sequence. It buys RAM and disk, not the whole wall clock.
#
# The one real caveat is reproducibility: the limit is approximate and NOT reproducible contig for
# contig, because contigs are admitted by several reader threads at once and each admits while the
# count it sees is still below the limit. Which 50 get in depends on read order and thread count.
# Harmless for a screening build; a caveat to state for a published one.
#
# >>> REMOVE THESE TWO LINES FOR THE FINAL BUILD <<< and delete data/projects/strepto/db
# first, or the screening database is silently reused. Keeping the cap in the published database is
# a separate decision, and it goes against the note in data/config.properties ("let's have all
# genomes ... make paper easier to defend").
# Genomes, not contigs: see the table above for why a contig limit of 50 gives S. pneumoniae
# two thirds of one assembly. maxGenomesPerTaxid groups the contigs of a WGS project by their
# accession prefix, so 50 here means 50 assemblies for every species alike.
maxGenomesPerTaxid=50
maxPerTaxidRank=species

# The two unnamed branches of the genus are struck out in taxids.txt. Without this line that only
# keeps their genomes out of the database, while the update reads every contig of the RefSeq release
# regardless and lets them raise the k-mers of the species that stay -- which is the whole effect
# worth avoiding. `allButExcluded' is `all' minus the contigs of exactly those taxa.
#
# The price, and it is real: a k-mer that besides a kept species only an excluded genome carries now
# stays claimed for that species. Where the excluded genome was in truth a different Streptococcus,
# the claim is wrong, and reads of a commensal can be reported as the pathogen. This is a considered
# trade for branches whose members cannot be told apart from the kept ones anyway.
refseq.updateScope=allButExcluded
