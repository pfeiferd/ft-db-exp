# THE K-MER INDEX FALSE POSITIVE RATE.
#
# KMerStoreWorkGoal builds a carrier vector with one independent Bloom probe per direct child plus
# OTHER, and getBestMatchingNode needs coversAll -- so a single phantom bit pushes a k-mer up the
# tree and a phantom OTHER bit pins it at the parent. The vector is clean with probability
# (1-fpp)^(C+1), and the rule is to pick fpp as -ln(P)/(C+1) for the largest child count C of any
# refined node.
#
# Here C = 148: the direct children of 1301 that carry genomes (of 169 children in all), counted
# from data/common/refseq/assembly_summary_refseq.txt against the taxdump beside it.
#
#   fpp 1e-2 (the shipped default, blocked filter, really 1.3e-2)  ->  P(clean) = 0.14
#   fpp 1e-4                                                       ->  P(clean) = 0.985
#   fpp 1e-5                                                       ->  P(clean) = 0.9985
#
# 1e-5 is chosen with room to spare, because the cost of being wrong here is a whole rebuild that
# measures the filter's noise floor instead of the biology. Below the default Genestrip switches
# from BlockedBloomFilter to a plain BloomFilter, which at 1e-5 needs about 24 bits per entry and
# roughly 90 ns per probe -- four times the blocked filter's probe time, and worth it.
#
# TRAP: nothing invalidates a stored index. A run that finds db/strepto_storekmerindex.ser.gz
# loads it and silently keeps the FPP it was written with. Delete that file by hand after changing
# this value, and confirm from the log that it says "K-mer index filter: BloomFilter ...", not
# BlockedBloomFilter.
ft.ftIndexBloomFilterFpp=1e-5

# DATABASE SIZE -- read this before the first build.
#
# The genus holds 22,664 RefSeq assemblies and 46.6 Gbp of sequence, against 4,135 and 5.8 Gbp for
# tick-borne, which is the largest bacterial database of this paper. Measured anchors from
# ft-paper/results (db_gen_perf.csv, dbstats.tex): tick-borne stores 520,788,183 k-mers in 3.8 GB
# and took 412 min at 25 GB RSS; parasites stores 1,659,904,646 k-mers in 11.4 GB at 35 GB RSS.
# The store costs a steady ~7.4 bytes per k-mer across all five databases.
#
# Streptococcus is far more redundant than any of them -- 9,263 of the 22,664 assemblies are
# S. pneumoniae alone -- so the distinct k-mer count does not scale with the 8x sequence. The
# estimate is 1.5 to 2.5 billion stored k-mers, i.e. 11 to 19 GB on disk: the same order as
# parasites. Disk is not the problem. What is:
#
#   RAM       parasites peaked at 35 GB RSS against a 64 GB heap. At 1.5x its k-mer count this
#             build sits at or past that heap, and an OOM comes hours in.
#   Wall      tick-borne's 412 min are dominated by the LCA update over the whole RefSeq bacteria
#             division, which this project pays too, plus 8x its fill, plus one further pass over
#             the genomes for the AUTO-sized k-mer index.
#
# The k-mer index itself is not a concern here: at ft.ftIndexBloomFilterFpp=1e-5 it costs about 24
# bits per (k-mer, child) pair, a few GB for a genus-only refinement.
#
# THE PER-SPECIES GENOME CAP, set below.
#
# It counts assemblies, and it is decided before a single genome is read.
#
# HOW A GENOME IS RECOGNISED. From the accession alone. A WGS accession is a letter prefix naming the
# sequencing project, a two-digit assembly version and a contig number -- NZ_CABEIU010000001 -- so
# every contig of one draft assembly carries the same letters. GenomeKeyTrie.genomeKeyLength() cuts
# there. A finished replicon has no such prefix and stands for itself, which counts a plasmid, and
# each segment of a segmented virus, as a genome of its own. Measured against RefSeq release 233 the
# prefixes recover 8,919 genomes for S. pneumoniae where assembly_summary_refseq.txt lists 9,263, and
# 88 to 92 per cent for its neighbours.
#
# WHY THIS MATTERS HERE. Until 2026-08-26 the parameter counted fasta entries, and one assembly of
# this genus arrives as 34 to 110 of them:
#
#   species                contigs in RefSeq   assemblies   contigs/asm   50 contigs were
#   S. pneumoniae                    717,500        9,263          77.5    0.65 genomes
#   S. pseudopneumoniae               18,306           167         109.6    0.46 genomes
#   S. mitis                          15,645           242          64.6    0.77 genomes
#   S. mutans                         21,953           398          55.2    0.91 genomes
#   S. oralis                          8,966           259          34.6    1.44 genomes
#   S. infantis                        2,824            84          33.6    1.49 genomes
#
# Every species got about ONE genome, not fifty -- and the error was one-sided: the better sequenced
# a species is, the more of its RefSeq entries are draft contigs, so the cap bit hardest exactly where
# it was meant to bite least. S. pneumoniae, which is what this project is about, was the most trimmed
# taxon of the genus. Any measurement made under that cap has to be repeated under this one.
#
# WHERE THE SELECTION IS MADE, and why not while reading. AccessionMapGoal makes it while it reads the
# accession catalog: one pass, one thread, a fixed order. Every pass of a build then reads the same
# set through AccessionMap.getAdmittedGenomes(), and a reader only asks whether a contig's genome is
# in it. Deciding while reading the genomes instead would decide differently in every pass, because
# which genomes a limit lets in would follow the order the reader threads happen to reach them -- and
# a fill that then admitted a genome the counting pass had not seen filed its k-mers at a node the
# store never registered, which ended a build with
#   IllegalStateException: Encountered a value not registered before the concurrent phase: 00137
# three minutes in, on 2026-08-26.
#
# Consequences worth knowing:
#   - The cap is REPRODUCIBLE. Same catalog, same taxonomy, same limit, same rank -> the same database,
#     whatever the thread count. The old caveat about read order is gone.
#   - It is EXACT, not approximate. A genome is in or out, whole.
#   - Only the REQUESTED taxa are counted: a taxon whose contigs the fill never stores cannot take
#     places from one whose contigs it does.
#   - The counting happens at the maxPerTaxidRank ancestor, set to species below.
#
# There is no second size bound: maxKMersPerTaxid was removed from Genestrip on 2026-08-26. It had the
# same divergence between passes and nothing used it. Either take fewer genomes, or take them all.
#
# WHAT THE CAP DOES AND DOES NOT TOUCH:
#
#   fill        capped. AbstractRefSeqFastaReader.infoLine() asks the selection, and FillDBGoal /
#               FillSizeGoal / FillBloomFilterGoal all inherit it. This is the whole saving: fewer
#               k-mers stored, hence the RAM and disk.
#   LCA update  NOT capped. DBGoal.MyFastaReader overrides infoLine() outright -- it consults only
#               isContigInScope() and never super.infoLine(). The k-mers of the genomes left out are
#               therefore still raised to their common ancestors, and the specificity of the
#               refinement is NOT affected by this cap.
#               NOTE what this asymmetry costs: a species is stored from fifty genomes but judged
#               against every genome of every neighbour. What it keeps of its own is a lower bound,
#               and the more it is trimmed the lower.
#   k-mer index NOT capped, deliberately: AbstractKMerIndexGoal's reader overrides infoLine() and
#               endContig(), the clustering phase being meant to have the maximum amount of data. So
#               the Jaccard matrix and the branching histograms see all 22,664 genomes for whatever
#               k-mers are in the store, capped or not.
#   quality     capped, and by the SAME selection the fill used -- DBQualityCountsGoal's reader extends
#               AbstractUpdateFastaReader, which calls super.infoLine(), and the selection reaches it
#               through the accession map it already depends on. Before the selection moved to the
#               catalog it made one of its own, so sp and sp* were measured against genomes the
#               database did not hold.
#
#   Consequence for the cost: the cap saves stored k-mers and fill CPU; the update and the k-mer index
#   still read the sequence. It buys RAM and disk, not the whole wall clock. The catalog scan costs a
#   little more than before, since it now cuts a genome key per accession -- only while a cap is set.
#
# >>> REMOVE THESE TWO LINES FOR THE FINAL BUILD <<< and delete data/projects/strepto/db first, or
# the screening database is silently reused -- the stored accession map included, which is where the
# selection lives. Keeping the cap in the published database is a separate decision, and it goes
# against the note in data/config.properties ("let's have all genomes ... make paper easier to
# defend").
maxGenomesPerTaxid=50
maxPerTaxidRank=species

# WHICH fifty, and not just how many. The selection is made while the accession catalog is read, so
# without this the fifty are whichever the reader threads reach first -- which is why a rebuild on
# 2026-09-22 changed the stored k-mer count by 4,311 without anything else changing. `preferRefFirst'
# restricts nothing (drafts stay in, and with them the species that have no finished assembly), it
# only keeps one of the fifty places for the assembly NCBI marks as the taxon's reference genome.
#
# Not `prefRef', which is a different thing: that one admits complete assemblies only and lets a
# marked one stand for its species alone, so S. pneumoniae would drop from fifty genomes to one.
#
# For this genus the mark is on 153 of the 157 species, 65 of them on a finished assembly and 89 on
# a draft; the draft ones are recognised through the WGS prefix their contigs carry, which locates
# 88 of those 89 in release 233.
refseq.genomesOnly=preferRefFirst

# And only assemblies at all. RefSeq carries region records -- NG_, NT_, NW_ -- which are single
# loci of a genome rather than a genome: for S. pneumoniae twelve capsule and resistance regions of
# a few kilobases each. They used to take twelve of the fifty places, which is fixed in Genestrip
# now, but they still enter the database while this is off, and here they are not wanted: a locus
# that is also part of an assembly already in the database adds nothing, and one that is not says
# nothing about the organism's genome. Transcripts are unaffected -- this is about DNA records.
refseq.assemblyAccessionsOnly=true

# The two unnamed branches of the genus are struck out in taxids.txt. Without this line that only
# keeps their genomes out of the database, while the update reads every contig of the RefSeq release
# regardless and lets them raise the k-mers of the species that stay -- which is the whole effect
# worth avoiding. `allButExcluded' is `all' minus the contigs of exactly those taxa.
#
# The price, and it is real: a k-mer that besides a kept species only an excluded genome carries now
# stays claimed for that species. Where the excluded genome was in truth a different Streptococcus,
# the claim is wrong, and reads of a commensal can be reported as the pathogen. This is a considered
# trade for branches whose members cannot be told apart from the kept ones anyway.
refseq.updateScope=allButExcluded

# NO FOLDING: THE GENOMES STAY WHERE THE TAXONOMY FILES THEM.
#
# The NCBI taxonomy carries a strain node for an arbitrary minority of this genus's genomes, and
# those nodes become data taxa of their own. `foldTaxaBelow=species' would file every genome at its
# species instead, which is what the quality measures would like -- they count data taxa, so a k-mer
# naming the pneumococcus and nothing else scores one over the genomes of that species rather than
# one. It is left off all the same: the database is then the reference taxonomy as it stands, and
# the measures state what they measure rather than what a transformation made of it.
#
# What made that reading untenable before was a bug, not the taxonomy. The reader marked a contig's
# taxon required and gave it its data node BEFORE asking whether maxGenomesPerTaxid had admitted the
# genome at all, so every rejected genome left an empty data taxon behind: 1,077 of 1,316 here, and
# under S. pneumoniae 152 of 153 candidates that can never carry a k-mer. Fixed in
# AbstractRefSeqFastaReader.infoLine(), pinned by GenomeLimitTest -- but only a rebuilt database has
# the fix in its tree.
#
# No fileNodes or genomeNodes here, deliberately: with either of them every genome would keep a node
# of its own, which multiplies the data taxa once more.
