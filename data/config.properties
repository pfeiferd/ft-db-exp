maxDust=500
dataNodes=true
# NO: let's have all genomes, since we move evolution stuff to another paper and
# - make paper easier to defend --> realistic database
# - gives high branching at genera --> realistic and introduction becomes clearer with good statistics
# - generally worsens path precision for both refined and unrefined dbs, but that's ok only relative improvement matters
# - generally worsens node precision - not usefuly for phylogeny considerations but for classification only relative improvement matters.
#refseq.assemblyAccessionsOnly=true
#genbank.fastaQualities=COMPLETE_LATEST, COMPLETE

# Repaint the progress bar every five seconds rather than every second. The bar is written to
# stderr, which the experiments now also record to a file, so each repaint leaves a line behind
# there; five seconds keeps those logs a fifth of the size while a bar remains just as watchable.
progressBarUpdateMs=5000

# Refuse a configuration value that its key cannot take, instead of warning and carrying on with the
# key's default. Set here, for every project of this experiment, because the runs are long: the
# protozoa database was once built for two and a half hours with `refseq.updateScope=allButExcluded'
# in its configuration and `ALL' in effect, the running Genestrip not yet knowing that value. The
# result looked plausible and answered a different question. Now such a run stops in its first second.
#
# Unknown keys and keys belonging to another goal remain warnings even so -- one configuration file
# serves every goal, and each goal checks the whole file.
strictConfigCheck=true
